name: CI CD Pipeline

on: 
  pull_request:
   branches:
     - main

jobs:
  build:
   runs-on: ubunut-latest

   steps:
    - name: Checkout code
      uses: actions/Checkout@v2

    - name: Docker Login
      uses: docker/login-action@v2
      with: 
        username: ${{secrets.DOCKERHUB_USERNAME}}
        password: ${{secrets.DOCKERHUB_TOKEN}}

    - name: Build and Push
      uses: docker/build-push-action@v2
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: lakhwinder97187/new:${{github.sha}}

    